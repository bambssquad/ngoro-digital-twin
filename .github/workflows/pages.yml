name: Deploy NGORO to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify static entrypoints
        run: |
          test -f web/dist/index.html
          test -f web/dist/assets/scene.json
          test -f web/dist/downloads/NGORO_Detailed_SU2023.skp
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
